<div class="login">
  <section class="login__hero" aria-label="Club Deportivo Alemán">
    <img class="login__photo" src="assets/img/login-training.jpg" alt="Entrenamiento con pesas en el gimnasio" fetchpriority="high" />
    <div class="login__brand">
      <img class="login__logo" src="assets/brand/logotipo-cda.svg" alt="" width="64" height="64" />
      <span class="login__brand-name">Club Deportivo Alemán</span>
    </div>
  </section>

  <div class="login__content">
    <div class="login__panel">
      <header class="login__header">
        <h1 class="login__title">Bienvenido de nuevo</h1>
        <p class="login__subtitle">Ingresa y sigue en movimiento.</p>
      </header>

      <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()" [attr.aria-busy]="enviando" novalidate>
        <app-ui-input
          formControlName="email"
          appearance="dark"
          label="Correo electrónico"
          type="email"
          icon="bi-envelope"
          placeholder="tu@email.com"
          autocomplete="email"
          [error]="emailCtrl.touched && emailCtrl.invalid ? 'Ingresa un correo válido' : ''">
        </app-ui-input>

        <app-ui-input
          formControlName="password"
          appearance="dark"
          label="Contraseña"
          type="password"
          icon="bi-lock"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          [error]="passwordCtrl.touched && passwordCtrl.invalid ? 'Mínimo 4 caracteres' : ''">
        </app-ui-input>

        <div *ngIf="errorMensaje" class="login__error" role="alert">
          <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
          <span>{{ errorMensaje }}</span>
        </div>

        <button class="login__submit" type="submit" [disabled]="enviando">
          <span class="login__spinner" *ngIf="enviando" aria-hidden="true"></span>
          <span>{{ enviando ? 'Iniciando sesión…' : 'Iniciar sesión' }}</span>
          <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
      </form>
      <p class="login__footer">Tu entrenamiento empieza aquí.</p>
    </div>
  </div>
</div>
