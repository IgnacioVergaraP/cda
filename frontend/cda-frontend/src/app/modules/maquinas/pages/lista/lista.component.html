<app-ui-page-header
  title="Máquinas"
  subtitle="Explorá los equipos y ejercicios del gimnasio">
</app-ui-page-header>

<div class="maquinas-lista__busqueda">
  <i class="bi bi-search maquinas-lista__busqueda-icon" aria-hidden="true"></i>
  <input
    type="search"
    class="maquinas-lista__busqueda-input"
    aria-label="Buscar máquinas"
    placeholder="Buscar máquinas o grupos musculares"
    [value]="busqueda"
    (input)="onBusquedaChange($event)" />
</div>

<app-musculo-filter
  [seleccionado]="musculoSeleccionado"
  (seleccionadoChange)="onMusculoChange($event)">
</app-musculo-filter>

<!-- Loading -->
<div *ngIf="cargando" class="maquinas-lista__loading" aria-live="polite">
  <span class="spinner" aria-hidden="true"></span>
  <span class="maquinas-lista__loading-text">Cargando máquinas…</span>
</div>

<!-- Error -->
<app-ui-empty-state
  *ngIf="!cargando && errorMensaje"
  icon="bi-wifi-off"
  title="No pudimos cargar el catálogo"
  [message]="errorMensaje">
  <app-ui-button variant="secondary" (clicked)="reintentar()">
    Reintentar
  </app-ui-button>
</app-ui-empty-state>

<!-- Empty (sin resultados) -->
<app-ui-empty-state
  *ngIf="!cargando && !errorMensaje && maquinasFiltradas.length === 0"
  icon="bi-search"
  [title]="maquinas.length === 0 ? 'Sin máquinas' : 'Sin resultados'"
  [message]="maquinas.length === 0
    ? 'No hay máquinas para el grupo muscular seleccionado.'
    : 'Prueba con otro término o grupo muscular.'">
</app-ui-empty-state>

<!-- Listado -->
<div *ngIf="!cargando && !errorMensaje && maquinasFiltradas.length > 0" class="maquinas-lista">
  <app-maquina-card
    *ngFor="let m of maquinasFiltradas; trackBy: trackById"
    [maquina]="m">
  </app-maquina-card>
</div>
