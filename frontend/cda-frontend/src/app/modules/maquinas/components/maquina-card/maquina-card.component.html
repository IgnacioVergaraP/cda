<a
  class="maquina-card"
  [routerLink]="['/maquinas', maquina.id]"
  [attr.aria-label]="'Ver detalle de ' + maquina.nombre">

  <div class="maquina-card__thumb">
    <app-muscle-map [muscles]="maquina.grupos_musculares" [primaryOnly]="true"></app-muscle-map>
  </div>

  <div class="maquina-card__body">
    <h3 class="maquina-card__title">{{ maquina.nombre }}</h3>

    <div class="maquina-card__tags">
      <app-ui-badge
        *ngFor="let g of maquina.grupos_musculares"
        variant="primary">
        {{ etiqueta(g) }}
      </app-ui-badge>
    </div>
  </div>

  <i class="bi bi-chevron-right maquina-card__chevron" aria-hidden="true"></i>
</a>
