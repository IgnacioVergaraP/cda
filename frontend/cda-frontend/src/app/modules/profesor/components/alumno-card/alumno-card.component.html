<a
  class="alumno-card"
  [routerLink]="['/profesor/alumnos', alumno.id]"
  [attr.aria-label]="'Ver perfil de ' + alumno.nombre">

  <app-avatar
    [nombre]="alumno.nombre"
    [imagenUrl]="alumno.imagen_url"
    size="md">
  </app-avatar>

  <div class="alumno-card__body">
    <p class="alumno-card__nombre">{{ alumno.nombre }}</p>
    <p class="alumno-card__email">{{ alumno.email }}</p>
  </div>

  <i class="bi bi-chevron-right alumno-card__chevron" aria-hidden="true"></i>

</a>
