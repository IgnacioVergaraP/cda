<div
  class="avatar"
  [class.avatar--sm]="size === 'sm'"
  [class.avatar--md]="size === 'md'"
  [class.avatar--lg]="size === 'lg'"
  [class]="'avatar--color-' + colorIndex">

  <img
    *ngIf="tieneImagen"
    [src]="imagenUrl!"
    [alt]="nombre"
    loading="lazy" />

  <span *ngIf="!tieneImagen" class="avatar__iniciales">{{ iniciales }}</span>

</div>
