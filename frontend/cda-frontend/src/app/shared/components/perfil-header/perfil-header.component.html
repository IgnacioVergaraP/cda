<div class="perfil-header">

  <div class="perfil-header__avatar">
    <app-avatar
      [nombre]="usuario.nombre"
      [imagenUrl]="usuario.imagen_url"
      size="lg">
    </app-avatar>
  </div>

  <div class="perfil-header__info">
    <div class="perfil-header__title-row">
      <app-ui-back-button></app-ui-back-button>
      <h1 class="perfil-header__nombre">{{ usuario.nombre }}</h1>
    </div>
    <p class="perfil-header__email">{{ usuario.email }}</p>
    <span class="perfil-header__rol">{{ rolEtiqueta }}</span>
  </div>

  <button
    *ngIf="mostrarEditar"
    type="button"
    class="perfil-header__editar"
    aria-label="Editar perfil"
    (click)="onEditar()">
    <i class="bi bi-pencil" aria-hidden="true"></i>
  </button>

</div>
