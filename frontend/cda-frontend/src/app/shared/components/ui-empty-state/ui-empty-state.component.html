<div class="ui-empty-state">
  <div class="ui-empty-state__icon" aria-hidden="true">
    <i class="bi {{ icon }}"></i>
  </div>
  <h3 *ngIf="title" class="ui-empty-state__title">{{ title }}</h3>
  <p *ngIf="message" class="ui-empty-state__message">{{ message }}</p>
  <div class="ui-empty-state__actions">
    <ng-content></ng-content>
  </div>
</div>
