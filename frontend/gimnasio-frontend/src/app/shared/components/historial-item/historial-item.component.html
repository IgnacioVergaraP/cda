<div class="historial-item">

  <button
    type="button"
    class="historial-item__main"
    [attr.aria-label]="'Ver evolución de ' + fila.ejercicio"
    (click)="onVerEvolucion()">

    <div class="historial-item__icon">
      <i class="bi {{ icono }}" aria-hidden="true"></i>
    </div>

    <div class="historial-item__body">
      <p class="historial-item__titulo">{{ fila.ejercicio }}</p>
      <p class="historial-item__meta">
        {{ fila.cantidad_series }} {{ fila.modalidad === 'cardio' ? 'bloque' : 'serie' }}{{ fila.cantidad_series === 1 ? '' : 's' }}
        · {{ fechaFormateada }}
      </p>
    </div>

    <i class="bi bi-chevron-right historial-item__chevron" aria-hidden="true"></i>
  </button>

  <button
    type="button"
    class="historial-item__editar"
    aria-label="Editar registros"
    (click)="onEditar($event)">
    <i class="bi bi-pencil" aria-hidden="true"></i>
  </button>

</div>
