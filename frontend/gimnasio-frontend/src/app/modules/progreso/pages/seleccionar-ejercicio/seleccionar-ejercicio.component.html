<app-ui-page-header title="Registrar entrenamiento" subtitle="Elige un ejercicio de fuerza o cardio"></app-ui-page-header>
<section class="seleccionar__catalogo">
  <app-ejercicio-picker (seleccionChange)="elegirEjercicio($event)"></app-ejercicio-picker>
</section>
<app-ui-card padding="md">
  <p class="seleccionar__label">Ejercicio personalizado</p>
  <p class="seleccionar__ayuda">Si el ejercicio de fuerza no está en el catálogo, puedes escribir su nombre.</p>
  <div class="seleccionar__libre">
    <input type="text" class="seleccionar__input" aria-label="Nombre del ejercicio personalizado" maxlength="100" placeholder="Nombre del ejercicio" [(ngModel)]="nombreLibre" (keydown.enter)="confirmarLibre()" />
    <app-ui-button variant="primary" [disabled]="!nombreLibre.trim()" (clicked)="confirmarLibre()">Continuar</app-ui-button>
  </div>
</app-ui-card>
