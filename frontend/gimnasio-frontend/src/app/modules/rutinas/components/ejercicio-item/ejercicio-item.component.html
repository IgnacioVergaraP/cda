<div class="ejercicio-item">
  <button
    type="button"
    class="ejercicio-item__details"
    [attr.aria-label]="'Ver detalle de ' + nombreVisible"
    (click)="onTap()">

    <div class="ejercicio-item__index">{{ indice }}</div>

    <app-muscle-map
      [muscles]="muscles"
      [primaryOnly]="true"
      [compact]="true">
    </app-muscle-map>

    <div class="ejercicio-item__body">
      <p class="ejercicio-item__name">
        {{ nombreVisible }}
        <i
          *ngIf="esLibre"
          class="bi bi-pencil-square ejercicio-item__badge-tipo"
          title="Ejercicio libre"
          aria-hidden="true">
        </i>
      </p>
      <p class="ejercicio-item__meta">
        {{ resumenSeries }}
        <span *ngIf="ejercicio.peso_sugerido"> · {{ ejercicio.peso_sugerido }}</span>
      </p>
    </div>

    <i
      class="bi ejercicio-item__chevron"
      [class.bi-chevron-right]="esMaquina"
      [class.bi-info-circle]="esLibre"
      aria-hidden="true">
    </i>
  </button>

  <button
    type="button"
    *ngIf="permitirRegistro"
    class="ejercicio-item__register"
    [attr.aria-label]="'Registrar serie de ' + nombreVisible"
    title="Registrar una serie"
    (click)="onRegister($event)">
    <i class="bi bi-plus-lg" aria-hidden="true"></i>
  </button>
</div>
